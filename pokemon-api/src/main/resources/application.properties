spring.application.name=pokemon-api

# === Base H2 en memoire (aucune installation necessaire) ===
spring.datasource.url=jdbc:h2:mem:pokemondb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:demo-data.sql
spring.jpa.show-sql=true

# Console web H2 : http://localhost:8080/h2-console  (JDBC URL : jdbc:h2:mem:pokemondb)
spring.h2.console.enabled=true
